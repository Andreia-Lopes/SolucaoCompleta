<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <title>Login</title>
</head>
<body>
    <nav class="navbar" id="cabecalho">
      <a class="navbar-brand m-5" href="index.html">← 🏁</a>
    </nav>

  <div class="d-flex justify-content-center align-items-center mt-5 flex-wrap gap-4">
    <div class="login-card col-11 col-sm-6 col-lg-3 p-4">
      <h1 class="mb-4">Login</h1>
      <form id="formLogin">
        <div class="mb-3">
          <label for="login" class="form-label">Login</label>
          <input type="text" id="login" class="form-control campo-input" placeholder="seu login" required>
        </div>
        <div class="mb-4">
          <label for="loginSenha" class="form-label">Senha</label>
          <input type="password" id="loginSenha" class="form-control campo-input" placeholder="..." required>
        </div>
        <div id="erroLogin" class="erro-msg mb-3 d-none"></div>
        <button type="submit" class="btn-entrar w-100 rounded border-0 mb-3">Entrar</button>
      </form>
      <button type="button" id="cadastroUsuario" class="btn-cadastrar w-100 rounded border-0">Criar conta</button>
    </div>

    <div class="cadastro-card col-11 col-sm-6 col-lg-3 p-4">
      <h1 class="mb-4">Cadastro</h1>
      <form id="formCadastro">
        <div class="mb-3">
          <label for="CadastroLogin" class="form-label">Login</label>
          <input type="text" id="CadastroLogin" class="form-control campo-input" required>
        </div>
        <div class="mb-3">
          <label for="CadastroNome" class="form-label">Nome completo</label>
          <input type="text" id="CadastroNome" class="form-control campo-input" required>
        </div>
        <div class="mb-3">
          <label for="CadastroEmail" class="form-label">E-mail</label>
          <input type="email" id="CadastroEmail" class="form-control campo-input" required>
        </div>
        <div class="mb-4">
          <label for="CadastroSenha" class="form-label">Senha</label>
          <input type="password" id="CadastroSenha" class="form-control campo-input" required>
        </div>
        <div id="erroCadastro" class="erro-msg mb-3 d-none"></div>
        <button type="submit" class="btn-cadastro w-100 rounded border-0">Cadastrar</button>
      </form>
    </div>
  </div>

  <script src="assets/scripts/app.js"></script>
  <script src="assets/scripts/login.js"></script>
</body>
</html>
