<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles.css">
    <title>Cadastro Itens</title>
</head>
<body>
  <nav class="navbar" id="cabecalho">
    <div class="container">
      <a class="navbar-brand" href="index.html">← 🏁</a>
    </div>
  </nav>

  <div class="mx-4 mx-md-5">
    <h1 class="mb-4">Cadastro de itens</h1>

    <form id="formItem" class="form-cadastro p-4 rounded-3 mb-5">
      <input type="hidden" id="itemId">

      <div class="row g-3">
        <div class="col-md-6">
          <label for="titulo" class="form-label">Título</label>
          <input type="text" id="titulo" class="form-control campo-input" required>
        </div>
        <div class="col-md-6">
          <label for="imagem" class="form-label">Imagem (caminho)</label>
          <input type="text" id="imagem" class="form-control campo-input" placeholder="assets/img/img0.jpg" required>
        </div>
        <div class="col-12">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea id="descricao" class="form-control campo-input" rows="4" required></textarea>
        </div>
        <div class="col-12 form-check ps-1">
          <input type="checkbox" id="destaque" class="form-check-input ms-1">
          <label for="destaque" class="form-check-label">Exibir no carrossel de destaques</label>
        </div>
      </div>

      <div class="mt-4 d-flex gap-3">
        <button type="submit" id="btnSalvarItem" class="btn-cadastro px-4 rounded border-0">Cadastrar</button>
        <button type="button" id="btnCancelar" class="btn btn-outline-light px-4 rounded">Cancelar</button>
      </div>
    </form>

    <h4 class="mb-3">Itens cadastrados</h4>
    <div class="table-responsive mb-5">
      <table class="table table-dark table-striped align-middle">
        <thead>
          <tr>
            <th>Título</th>
            <th>Destaque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/scripts/app.js"></script>
</body>
</html>
